        return 301 /zpm/;
    }

    location = /zpm {
        return 301 /zpm/;
    }

    location ^~ /zpm/ {
        alias /var/www/holdsafecripto/dist2/;
        index index.html;
        try_files $uri $uri/ /zpm/index.html;
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/zpm/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|json|map)$ {
        alias /var/www/holdsafecripto/dist2/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/zpm/.*\.html$ {
        alias /var/www/holdsafecripto/dist2/;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # =========================
    # SSL
    # =========================
    ssl_certificate     /etc/letsencrypt/live/unionzod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unionzod.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
